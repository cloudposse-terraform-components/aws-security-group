# Test case for account_map and VPC bypass patterns
# When account_map_enabled and vpc_remote_state_enabled are false,
# the component uses the static variables instead of remote state lookups
components:
  terraform:
    security-group/bypass:
      metadata:
        component: target
      vars:
        name: "security-group-bypass"
        enabled: true
        # Bypass account-map remote state
        account_map_enabled: false
        account_map:
          full_account_map:
            default-test: "123456789012"
          audit_account_account_name: "default-test"
          root_account_account_name: "default-test"
          identity_account_account_name: "default-test"
          aws_partition: "aws"
          iam_role_arn_templates: {}
        # Bypass VPC remote state - provide VPC ID directly
        vpc_remote_state_enabled: false
        vpc:
          vpc_id: "vpc-12345678"
          private_subnet_ids: []
          public_subnet_ids: []
        security_group_description: "Security group with bypass patterns"
        allow_all_egress: true
        rules: []
