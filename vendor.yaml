apiVersion: atmos/v1
kind: AtmosVendorConfig
metadata:
  name: component-security-group
  description: Vendor dependencies for local development and linting
spec:
  sources:
    - component: "account-map"
      source: github.com/cloudposse/terraform-aws-components.git//modules/account-map?ref={{.Version}}
      version: 1.520.0
      targets:
        - "account-map"
      included_paths:
        - "**/**"
      excluded_paths: []
